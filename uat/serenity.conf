serenity {
  project.name = Todo UAT Demonstration
  project.version = 1.0.0

  encoding = UTF-8
  output 
      directory = target/site/serenity
      reports = 
          - capability
          - requirement
          - test

  test_runner = junit
  webdriver 
      driver = chrome
      capabilities 
          acceptInsecureCerts = true
          "goog:chromeOptions" {
              w3c = false
              args = [
                  "--headless",
                  "--window-size=1920,1080",
                  "--no-sandbox",
                  "--disable-gpu",
                  "--disable-dev-shm-usage"
              ]
          }
}

webdriver.chrome.driver = driver/chromedriver

# Environment configuration
environments {
  default {
    base.url = http://localhost:8000
  }
}
